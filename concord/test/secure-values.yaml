# Values exercising the chart's externally managed security contract:
# - credentials come from an external Secret, none are rendered by the chart;
# - the agent operator reads its token from the same Secret;
# - PostgreSQL explicitly selects an 18.6 digest, with no password in its ConfigMap;
# - both Services are ClusterIP without the debug port;
# - the operator gets namespaced RBAC plus a cluster-wide AgentPool watch;
# - the server gets the Kubernetes dispatcher RBAC.
server:
  type: internal
  existingSecret: concord-server-credentials-external
  websocketsRequirePermission: false
  kubernetesDispatcherRbac:
    enabled: true

agentOperator:
  enabled: true
  tokenSecretName: concord-server-credentials-external
  tokenSecretKey: AGENT_TOKEN
  rbac:
    clusterWide: false

expose:
  type: clusterIP
  debug:
    enabled: false

database:
  type: internal
  internal:
    serviceType: ClusterIP
    image:
      ref: library/postgres@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
