# Isolated tests only. Replace DIND_IMAGE with a pinned Docker DinD image.
# Supply concord-agent-token/SERVER_API_KEY outside Helm before applying.
apiVersion: concord.walmartlabs.com/v1alpha1
kind: AgentPool
metadata:
  name: concord-test
spec:
  queueSelector:
    agent:
      flavor: kubernetes
  autoScale: false
  minSize: 1
  maxSize: 10
  size: 1
  configMap:
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: '%%configMapName%%'
    data:
      mvn.json: |
        {
          "repositories": [
            {
              "id": "central",
              "url": "https://repo.maven.apache.org/maven2/"
            }
          ]
        }
      agent.conf: |
        concord-agent {
          capabilities.flavor = "kubernetes"
          workersCount = 1
          server {
            apiBaseUrl = "http://concord-server:8001"
            websocketUrl = "ws://concord-server:8001/websocket"
            apiKey = ${SERVER_API_KEY}
          }
        }
      preStopHook.sh: '%%preStopHook%%'
  pod:
    apiVersion: v1
    kind: Pod
    metadata:
      name: '%%podName%%'
      labels:
        app: '%%app%%'
        poolName: '%%poolName%%'
        concordCfgHash: '%%concordCfgHash%%'
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 3600
      containers:
      - name: dind
        image: DIND_IMAGE
        args:
        - -H
        - tcp://127.0.0.1:6666
        - --tls=false
        resources:
          requests:
            cpu: 1
            memory: 2G
            ephemeral-storage: 2G
          limits:
            cpu: 2
            memory: 3G
            ephemeral-storage: 3G
        volumeMounts:
        - name: process-tmp
          mountPath: /tmp
        - mountPath: /hooks/preStopHook.sh
          name: cfg
          subPath: preStopHook.sh
        securityContext:
          privileged: true
        lifecycle:
          preStop:
            exec:
              command:
              - sh
              - /hooks/preStopHook.sh
        command:
        - dockerd
      - name: agent
        image: walmartlabs/concord-agent:2.47.0
        imagePullPolicy: IfNotPresent
        volumeMounts:
        - mountPath: /opt/concord/conf/agent.conf
          name: cfg
          subPath: agent.conf
        - mountPath: /opt/concord/conf/mvn.json
          name: cfg
          subPath: mvn.json
        - mountPath: /opt/concord/hooks/preStopHook.sh
          name: cfg
          subPath: preStopHook.sh
        - mountPath: /tmp
          name: process-tmp
        resources:
          requests:
            cpu: 1
            memory: 1G
          limits:
            cpu: 2
            memory: 2G
        env:
        - name: CONCORD_TMP_DIR
          value: /tmp/concord
        - name: CONCORD_DOCKER_LOCAL_MODE
          value: 'false'
        - name: DOCKER_HOST
          value: tcp://localhost:6666
        - name: CONCORD_CFG_FILE
          value: /opt/concord/conf/agent.conf
        - name: CONCORD_MAVEN_CFG
          value: /opt/concord/conf/mvn.json
        - name: MY_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: MY_POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: MY_POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: USER_AGENT
          value: k8s-agent $(MY_POD_NAMESPACE)/$(MY_POD_NAME) @ $(MY_POD_IP)
        - name: SERVER_API_KEY
          valueFrom:
            secretKeyRef:
              name: concord-agent-token
              key: SERVER_API_KEY
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/bash
              - /opt/concord/hooks/preStopHook.sh
      volumes:
      - name: cfg
        configMap:
          name: '%%configMapName%%'
      - name: process-tmp
        emptyDir: {}
