{{- if and .Values.networkPolicy.enabled (eq .Values.server.type "internal") }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: concord-server
{{ include "concord.commonMetadataLabels" . | indent 2 }}
spec:
  podSelector:
    matchLabels:
      app: concord-server
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8001
      from:
        # Server replicas can call one another.
        - podSelector:
            matchLabels:
              app: concord-server
        {{- if .Values.agentOperator.enabled }}
        - podSelector:
            matchLabels:
              name: concord-agent-operator
        {{- end }}
        {{- with .Values.networkPolicy.server.agentPeers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.networkPolicy.server.ingressPeers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
