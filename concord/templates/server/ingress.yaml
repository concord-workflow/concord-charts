{{- if eq .Values.server.type "internal" -}}
{{- if eq .Values.expose.type "ingress" }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: concord-ingress
{{ include "concord.commonMetadataLabels" . | indent 2 }}
{{- if .Values.expose.ingress.annotations }}
{{- with .Values.expose.ingress.annotations }}
  annotations:
{{ toYaml . | indent 4 }}
{{- end }}
{{- end }}
spec:
  {{- with .Values.expose.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- if .Values.expose.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.expose.ingress.host }}
      {{- with .Values.expose.tls.secretName }}
      secretName: {{ . }}
      {{- end }}
  {{- end }}
  rules:
  - host: {{ .Values.expose.ingress.host }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: concord-server
            port:
              number: {{ .Values.expose.port }}
{{- end }}
{{- end -}}
