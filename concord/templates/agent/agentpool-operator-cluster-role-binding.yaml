{{- if .Values.agentOperator.enabled }}
{{- if .Values.agentOperator.rbac.clusterWide }}
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "concord.agentOperatorRbacName" . }}
{{ include "concord.commonMetadataLabels" . | indent 2 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "concord.agentOperatorRbacName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "concord.agentOperatorRbacName" . }}
  apiGroup: rbac.authorization.k8s.io
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "concord.agentOperatorRbacName" . }}
  namespace: {{ .Release.Namespace }}
{{ include "concord.commonMetadataLabels" . | indent 2 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "concord.agentOperatorRbacName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "concord.agentOperatorRbacName" . }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
